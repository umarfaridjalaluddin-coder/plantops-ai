[project]
name = "plantops-ai"
version = "0.1.0"
description = "AI-assisted operational monitoring and predictive maintenance prototype using synthetic equipment data."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
